# Mantiene despierta la base de datos de Supabase (plan gratis).
#
# Supabase pausa los proyectos gratuitos tras unos 7 días sin actividad y la app
# de CofiTech quedaría sin precios, clima ni alertas hasta reactivarlo a mano.
# Este flujo hace una consulta de solo lectura cada 3 días.
#
# Configuración (una vez): GitHub → Settings → Secrets and variables → Actions →
# New repository secret → nombre SUPABASE_DB_URL, valor = la cadena del
# "Session pooler" de Supabase (la misma de secrets.toml). Si el secreto no
# existe, el flujo termina sin error y no hace nada.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 13 */3 * *"     # cada 3 días, 08:17 hora de Colombia
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta de solo lectura a la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Falta el secreto SUPABASE_DB_URL; no se hace nada."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT 'cofitech ok', count(*) FROM cafe.dim_municipio;"
